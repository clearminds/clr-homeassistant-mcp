[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-homeassistant-mcp"
version = "2.0.0"
description = "MCP server for Home Assistant smart home control"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "home-assistant", "smart-home", "iot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=4.2,<5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/clearminds/clr-homeassistant-mcp"

[project.scripts]
clr-homeassistant-mcp = "clr_homeassistant_mcp.server:main"
